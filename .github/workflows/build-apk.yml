name: 编译 Android APK

on:
  push:
    branches: [ main ]  # 推送到 main 分支时自动编译
  workflow_dispatch:    # 允许手动点击编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 赋予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 编译 Debug 版 APK
        run: ./gradlew assembleDebug

      - name: 上传编译好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
